# АРМ + ТЗД (PWA) і проксі до API. HTTPS (TLS 1.2+, NFR-3.1) потрібен також для камери на телефоні.
upstream wms_api { server api:8000; }

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# HTTP -> HTTPS: сторінки перенаправляються на HTTPS (порт хоста підставляє docker-entrypoint.sh).
# API на HTTP проксіюється без редиректу: 301 перетворює POST на GET (405), а вкладки, відкриті
# з кешу PWA на http://, мають і далі працювати.
server {
    listen 80;
    location ~ ^/(api|mock|health|docs|redoc|openapi.json) {
        proxy_pass http://wms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # Старий service worker PWA на http:// не може оновитися через редирект (браузер його відкидає) і назавжди
    # показує застарілу збірку. Тут віддаємо sw.js, що чистить кеш, знімає себе і перезавантажує вкладки → HTTPS.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store";
        return 200 'self.addEventListener("install",()=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil((async()=>{for(const k of await caches.keys())await caches.delete(k);await self.registration.unregister();for(const c of await self.clients.matchAll({type:"window"}))c.navigate(c.url);})()));';
    }
    location / { return 301 https://$host:__HTTPS_PORT__$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/wms.crt;
    ssl_certificate_key /etc/nginx/certs/wms.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/wms-locations.conf;
}
